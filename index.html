<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivation Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="text-area">
            <h1>Keep Going</h1>
            <h2>You are stronger than you think</h2>
        </div>
        <div class="quote-box">
            <p id="quote-line">Click New To Generate One</p>
            <p id="author"></p>
        </div>
        <div class="quote-action">
            <button id="new-quote">New Quote</button>
            <button id="copy-button">Copy Quote</button>
            <h3  id="copy"></h3>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
